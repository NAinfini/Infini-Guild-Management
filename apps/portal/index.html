<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{SITE_DESCRIPTION}}" />
    <meta property="og:title" content="{{SITE_NAME}}" />
    <meta property="og:description" content="{{SITE_DESCRIPTION}}" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="{{SITE_LOGO_URL}}" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="{{SITE_NAME}}" />
    <meta name="twitter:description" content="{{SITE_DESCRIPTION}}" />
    <meta name="twitter:image" content="{{SITE_LOGO_URL}}" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/fonts/saira-semi-condensed-latin-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>{{SITE_NAME}}</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0A0A0F; overflow: hidden; }
      html.splash-done { overflow: auto; }
      #root { width: 100%; height: 100%; }

      #splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #0A0A0F;
        display: grid;
        place-items: center;
      }

      .splash-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: min(320px, calc(100vw - 48px));
        font-family: Inter, system-ui, sans-serif;
      }
      .splash-logo {
        width: clamp(112px, 18vw, 152px);
        height: auto;
      }
      .splash-divider {
        margin: 18px 0 0;
        width: 64px;
        height: 1px;
        background: rgba(191,155,80,0.55);
      }
      .splash-title {
        margin: 14px 0 0;
        font-size: clamp(1.6rem, 4vw, 2.25rem);
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #F5F1E8;
        text-align: center;
      }
      .splash-subtitle {
        margin: 6px 0 0;
        font-size: 0.75rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(245,241,232,0.52);
        text-align: center;
      }
      .splash-bar {
        margin: 28px 0 0;
        width: 160px;
        height: 2px;
        border-radius: 2px;
        background: rgba(245,241,232,0.14);
        overflow: hidden;
      }
      .splash-bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #BF9B50;
        animation: splash-progress 1.2s ease-in-out infinite;
      }
      @keyframes splash-progress {
        from { transform: translateX(-100%); }
        to { transform: translateX(350%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-bar::after {
          width: 100%;
          opacity: 0.65;
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="splash-center">
        <img src="{{SITE_LOGO_URL}}" alt="" class="splash-logo" />
        <div class="splash-divider"></div>
        <h1 class="splash-title" id="splash-title">{{SITE_NAME}}</h1>
        <p class="splash-subtitle">{{SITE_NAME}}</p>
        <div class="splash-bar"></div>
      </div>
    </div>

    <div id="root" style="opacity:0;position:fixed;inset:0"></div>
    <script src="/zod-csp.js"></script>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
