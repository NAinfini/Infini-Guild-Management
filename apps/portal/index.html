<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{SITE_DESCRIPTION}}" />
    <meta property="og:title" content="{{SITE_NAME}}" />
    <meta property="og:description" content="{{SITE_DESCRIPTION}}" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="{{SITE_LOGO_URL}}" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="{{SITE_NAME}}" />
    <meta name="twitter:description" content="{{SITE_DESCRIPTION}}" />
    <meta name="twitter:image" content="{{SITE_LOGO_URL}}" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/visual-themes/forged/public/access-desktop.webp"
      as="image"
      media="(min-width: 768px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      href="/visual-themes/forged/public/access-mobile.webp"
      as="image"
      media="(max-width: 767px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      href="/fonts/saira-semi-condensed-latin-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>{{SITE_NAME}}</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0A0A0F; overflow: hidden; }
      html.splash-done { overflow: auto; }
      #root { width: 100%; height: 100%; }

      #splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: 1rem;
        overflow: hidden;
        background: #0A0A0F;
        color: #F0EDE8;
      }
      #splash > picture,
      .splash-scene,
      .splash-scrim {
        position: absolute;
        inset: 0;
      }
      .splash-scene {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }
      .splash-scrim {
        background: rgba(10,10,15,0.52);
      }
      .splash-center {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-sizing: border-box;
        width: min(420px, calc(100vw - 32px));
        padding: clamp(1.25rem, 3vw, 1.75rem);
        border: 1px solid rgba(47,180,156,0.42);
        border-radius: var(--radius-surface, 10px);
        background: rgba(10,10,15,0.88);
        box-shadow: 0 24px 80px rgba(0,0,0,0.48), inset 0 0 0 1px rgba(47,180,156,0.2);
        font-family: "Saira Semi Condensed", system-ui, sans-serif;
        text-align: center;
      }
      .splash-brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        min-width: 0;
      }
      .splash-emblem {
        display: block;
        width: clamp(48px, 6vw, 60px);
        height: clamp(48px, 6vw, 60px);
        flex: 0 0 auto;
        object-fit: contain;
      }
      .splash-title {
        min-width: 0;
        margin: 0;
        font-size: clamp(1.35rem, 3vw, 1.75rem);
        font-weight: 700;
        line-height: 1.2;
        color: #F0EDE8;
        text-wrap: balance;
      }
      .splash-status {
        margin: 14px 0 0;
        font-family: system-ui, sans-serif;
        font-size: 0.75rem;
        font-weight: 600;
        line-height: 1.35;
        color: rgba(240,237,232,0.72);
      }
      .splash-progress {
        margin: 20px 0 0;
        width: 132px;
        height: 2px;
        overflow: hidden;
        background: rgba(240,237,232,0.2);
      }
      .splash-progress::after {
        content: "";
        display: block;
        width: 58%;
        height: 100%;
        background: #2FB49C;
        opacity: 0.8;
      }
      @media (max-width: 767px) {
        #splash {
          place-items: center;
          padding: 1rem;
        }
        .splash-center {
          width: min(448px, 100%);
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-busy="true" data-visual-theme="forged">
      <picture>
        <source
          id="splash-scene-mobile"
          media="(max-width: 767px)"
          srcset="/visual-themes/forged/public/access-mobile.webp"
        />
        <img
          id="splash-scene"
          class="splash-scene"
          src="/visual-themes/forged/public/access-desktop.webp"
          width="1672"
          height="941"
          alt=""
          aria-hidden="true"
          fetchpriority="high"
        />
      </picture>
      <div class="splash-scrim" aria-hidden="true"></div>
      <div class="splash-center">
        <div class="splash-brand">
          <img
            id="splash-emblem"
            class="splash-emblem"
            src="/guild-logo.svg"
            width="60"
            height="60"
            alt=""
            aria-hidden="true"
            fetchpriority="high"
          />
          <h1 class="splash-title" id="splash-title">{{SITE_NAME}}</h1>
        </div>
        <p class="splash-status" id="splash-status" role="status" aria-live="polite">Preparing your guild space…</p>
        <div class="splash-progress" aria-hidden="true"></div>
      </div>
    </div>

    <div id="root" style="opacity:0;position:fixed;inset:0"></div>
    <script src="/zod-csp.js"></script>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
