<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{SITE_DESCRIPTION}}" />
    <meta property="og:title" content="{{SITE_NAME}}" />
    <meta property="og:description" content="{{SITE_DESCRIPTION}}" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="{{SITE_LOGO_URL}}" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="{{SITE_NAME}}" />
    <meta name="twitter:description" content="{{SITE_DESCRIPTION}}" />
    <meta name="twitter:image" content="{{SITE_LOGO_URL}}" />
    <link rel="icon" href="{{SITE_LOGO_URL}}" />
    <link
      rel="preload"
      href="/fonts/saira-semi-condensed-latin-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>{{SITE_NAME}}</title>
    <style>
      html {
        --splash-bg: #0A0A0F;
        --splash-text: #F0EDE8;
        --splash-text-muted: rgba(240,237,232,0.72);
        --splash-card: #1C1D24;
        --splash-scene: url('/visual-themes/forged/public/login-desktop.webp');
        --splash-mobile-scene: url('/visual-themes/forged/public/login-mobile.webp');
      }
      @media (prefers-color-scheme: light) {
        html {
          --splash-bg: #E9ECEC;
          --splash-text: #192526;
          --splash-text-muted: rgba(25,37,38,0.68);
          --splash-card: #F8F7F3;
          --splash-scene: url('/visual-themes/forged/public/light/login-desktop.webp');
          --splash-mobile-scene: url('/visual-themes/forged/public/light/login-mobile.webp');
        }
      }
      html[data-theme="dark"] {
        --splash-bg: #0A0A0F;
        --splash-text: #F0EDE8;
        --splash-text-muted: rgba(240,237,232,0.72);
        --splash-card: #1C1D24;
        --splash-scene: url('/visual-themes/forged/public/login-desktop.webp');
        --splash-mobile-scene: url('/visual-themes/forged/public/login-mobile.webp');
      }
      html[data-theme="light"] {
        --splash-bg: #E9ECEC;
        --splash-text: #192526;
        --splash-text-muted: rgba(25,37,38,0.68);
        --splash-card: #F8F7F3;
        --splash-scene: url('/visual-themes/forged/public/light/login-desktop.webp');
        --splash-mobile-scene: url('/visual-themes/forged/public/light/login-mobile.webp');
      }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--splash-bg); overflow: hidden; }
      html.splash-done { overflow: auto; }
      #root { width: 100%; height: 100%; }

      #splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: 1rem;
        overflow: auto;
        background: var(--splash-bg) var(--splash-scene) center / cover no-repeat;
        color: var(--text-primary, var(--splash-text));
      }
      .splash-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        box-sizing: border-box;
        width: min(32rem, 100%);
        padding: clamp(1.5rem, 5vw, 3rem);
        border: 1px solid color-mix(in srgb, var(--splash-text) 14%, transparent);
        border-radius: 20px;
        background: var(--surface-base, var(--splash-card));
        box-shadow: 0 24px 64px rgb(0 0 0 / 24%);
        font-family: "Saira Semi Condensed", system-ui, sans-serif;
        text-align: center;
      }
      .splash-brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        min-width: 0;
        flex-direction: column;
      }
      .splash-emblem {
        display: block;
        width: clamp(56px, 6vw, 72px);
        height: clamp(56px, 6vw, 72px);
        flex: 0 0 auto;
        object-fit: contain;
      }
      .splash-title {
        min-width: 0;
        margin: 0;
        font-size: clamp(1.5rem, 3vw, 2rem);
        font-weight: 700;
        line-height: 1.2;
        color: var(--text-primary, var(--splash-text));
        text-wrap: balance;
        overflow-wrap: anywhere;
      }
      .splash-status {
        margin: 24px 0 0;
        font-family: system-ui, sans-serif;
        font-size: 0.875rem;
        font-weight: 600;
        line-height: 1.35;
        color: var(--text-muted, var(--splash-text-muted));
      }
      .splash-indicator {
        width: 28px;
        height: 28px;
        margin-top: 24px;
        border: 2px solid color-mix(in srgb, var(--splash-text) 15%, transparent);
        border-top-color: var(--brand-primary, #2BB3A3);
        border-radius: 50%;
        animation: splash-spin 1s linear infinite;
      }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
      @media (max-width: 767px) {
        #splash { background-image: var(--splash-mobile-scene); }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-indicator { animation: none; }
      }
      html[data-motion="reduced"] .splash-indicator { animation: none; }
    </style>
  </head>
  <body>
    <div id="splash" aria-busy="true">
      <div class="splash-center">
        <div class="splash-brand">
          <img
            id="splash-emblem"
            class="splash-emblem"
            src="{{SITE_LOGO_URL}}"
            width="60"
            height="60"
            alt=""
            aria-hidden="true"
            fetchpriority="high"
          />
          <h1 class="splash-title" id="splash-title">{{SITE_NAME}}</h1>
        </div>
        <p class="splash-status" id="splash-status" role="status" aria-live="polite">Preparing your guild space…</p>
        <div class="splash-indicator" aria-hidden="true"></div>
      </div>
    </div>

    <div id="root" style="opacity:0;position:fixed;inset:0"></div>
    <script src="/zod-csp.js"></script>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
