<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Guild Management Portal — roster, events, wiki, and tools for your guild." />
    <meta property="og:title" content="{{SITE_NAME}}" />
    <meta property="og:description" content="Guild Management Portal — roster, events, wiki, and tools for your guild." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="{{SITE_LOGO_URL}}" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="{{SITE_NAME}}" />
    <meta name="twitter:description" content="Guild Management Portal — roster, events, wiki, and tools for your guild." />
    <meta name="twitter:image" content="{{SITE_LOGO_URL}}" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>{{SITE_NAME}}</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0A0A0F; overflow: hidden; }
      html.splash-done { overflow: auto; }
      #root { width: 100%; height: 100%; }

      #splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #0A0A0F;
        overflow: hidden;
      }
      #splash canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

      .splash-glow {
        position: absolute;
        top: 50%; left: 50%;
        width: 600px; height: 600px;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(191,155,80,0.08) 0%, transparent 60%);
        animation: glow-pulse 4s ease-in-out infinite alternate;
      }
      @keyframes glow-pulse {
        from { transform: translate(-50%,-50%) scale(0.9); opacity: 0.6; }
        to   { transform: translate(-50%,-50%) scale(1.15); opacity: 1; }
      }

      .splash-ring {
        position: absolute;
        top: 50%; left: 50%;
        border-radius: 50%;
        border: 1px solid rgba(191,155,80,0.06);
      }
      .splash-ring-1 { width: 280px; height: 280px; margin: -140px 0 0 -140px; animation: spin 25s linear infinite; }
      .splash-ring-2 { width: 400px; height: 400px; margin: -200px 0 0 -200px; border-style: dashed; border-color: rgba(191,155,80,0.04); animation: spin 35s linear infinite reverse; }
      .splash-ring-3 { width: 520px; height: 520px; margin: -260px 0 0 -260px; border-color: rgba(191,155,80,0.03); animation: spin 45s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }

      .splash-center {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: Inter, system-ui, sans-serif;
      }
      .splash-logo {
        width: clamp(130px, 22vw, 190px);
        height: auto;
        filter: drop-shadow(0 0 24px rgba(191,155,80,0.5)) drop-shadow(0 0 80px rgba(191,155,80,0.2));
      }
      .splash-divider {
        margin: 20px 0 0;
        width: clamp(80px, 14vw, 130px);
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(191,155,80,0.5), transparent);
      }
      .splash-title {
        margin: 16px 0 0;
        font-size: clamp(1.8rem, 5vw, 3rem);
        font-weight: 700;
        letter-spacing: 0.1em;
        background: linear-gradient(135deg, #d4b878, #f5e6c8 45%, #c9a84c 55%, #f5e6c8);
        background-size: 200% 200%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: gold-shift 5s ease infinite;
      }
      @keyframes gold-shift { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
      .splash-subtitle {
        margin: 6px 0 0;
        font-size: clamp(0.7rem, 1.6vw, 0.85rem);
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: rgba(191,155,80,0.35);
      }
      .splash-bar {
        margin: 32px 0 0;
        width: 180px; height: 3px;
        border-radius: 3px;
        background: rgba(191,155,80,0.15);
        overflow: hidden;
      }
      .splash-bar::after {
        content: "";
        display: block;
        width: 35%; height: 100%;
        border-radius: 3px;
        background: linear-gradient(90deg, transparent, rgba(212,184,120,0.9), transparent);
        box-shadow: 0 0 8px rgba(191,155,80,0.4);
        animation: bar-slide 1.4s ease-in-out infinite;
      }
      @keyframes bar-slide { from { transform: translateX(-120%); } to { transform: translateX(386%); } }
    </style>
  </head>
  <body>
    <div id="splash">
      <canvas id="splash-canvas"></canvas>
      <div class="splash-glow"></div>
      <div class="splash-ring splash-ring-1"></div>
      <div class="splash-ring splash-ring-2"></div>
      <div class="splash-ring splash-ring-3"></div>
      <div class="splash-center">
        <img src="{{SITE_LOGO_URL}}" alt="" class="splash-logo" />
        <div class="splash-divider"></div>
        <h1 class="splash-title" id="splash-title">{{SITE_NAME}}</h1>
        <p class="splash-subtitle">{{SITE_NAME}}</p>
        <div class="splash-bar"></div>
      </div>
    </div>
    <script>
      (function() {
        var c = document.getElementById("splash-canvas");
        if (!c) return;
        var ctx = c.getContext("2d");
        var dpr = window.devicePixelRatio || 1;
        var pts = [], stars = [], raf;

        function resize() {
          c.width = innerWidth * dpr;
          c.height = innerHeight * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function mkPt() {
          var g = Math.random() > 0.6;
          return { x: Math.random()*innerWidth, y: Math.random()*innerHeight, vx: (Math.random()-.5)*.25, vy: -Math.random()*.2-.03, r: Math.random()*1.4+.3, a: Math.random()*.35+.05, p: Math.random()*Math.PI*2, c: g?"191,155,80":"148,163,184" };
        }

        function mkStar() {
          var spd = 4+Math.random()*6, e = Math.random(), x, y, ang;
          if (e < .5) { x = Math.random()*innerWidth; y = -10; ang = Math.PI*.15+Math.random()*Math.PI*.2; }
          else if (e < .75) { x = -10; y = Math.random()*innerHeight*.7; ang = Math.PI*.05+Math.random()*Math.PI*.15; }
          else { x = innerWidth+10; y = Math.random()*innerHeight*.7; ang = Math.PI-(Math.PI*.05+Math.random()*Math.PI*.15); }
          return { x:x, y:y, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd, life:1, decay:.008+Math.random()*.008, len:80+Math.random()*100, w:1.5+Math.random()*1.5, gold:Math.random()>.5 };
        }

        function draw() {
          ctx.clearRect(0, 0, innerWidth, innerHeight);
          var w = innerWidth, h = innerHeight;
          for (var i=0; i<pts.length; i++) {
            var p=pts[i]; p.x+=p.vx; p.y+=p.vy; p.p+=.01;
            if(p.x<0)p.x=w; if(p.x>w)p.x=0; if(p.y<-10){p.y=h+10;p.x=Math.random()*w;}
            var a=p.a*(.5+.5*Math.sin(p.p));
            ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle="rgba("+p.c+","+a+")"; ctx.fill();
          }
          for (var i=0; i<pts.length; i++) for (var j=i+1; j<pts.length; j++) {
            var dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y, d=dx*dx+dy*dy;
            if(d<14000){ctx.strokeStyle="rgba(191,155,80,"+((1-d/14000)*.035)+")";ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.stroke();}
          }
          if(stars.length<8 && Math.random()<.03) stars.push(mkStar());
          for (var i=stars.length-1; i>=0; i--) {
            var s=stars[i]; s.x+=s.vx; s.y+=s.vy; s.life-=s.decay;
            if(s.life<=0||s.x<-60||s.x>w+60||s.y>h+60){stars.splice(i,1);continue;}
            var mag=Math.sqrt(s.vx*s.vx+s.vy*s.vy), tx=s.x-(s.vx/mag)*s.len, ty=s.y-(s.vy/mag)*s.len;
            var g=ctx.createLinearGradient(tx,ty,s.x,s.y);
            if(s.gold){g.addColorStop(0,"rgba(191,155,80,0)");g.addColorStop(.4,"rgba(212,184,120,"+(s.life*.5)+")");g.addColorStop(.8,"rgba(235,210,160,"+(s.life*.8)+")");g.addColorStop(1,"rgba(255,245,220,"+s.life+")");}
            else{g.addColorStop(0,"rgba(148,163,184,0)");g.addColorStop(.4,"rgba(200,210,220,"+(s.life*.5)+")");g.addColorStop(.8,"rgba(230,240,255,"+(s.life*.8)+")");g.addColorStop(1,"rgba(255,255,255,"+s.life+")");}
            ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(s.x,s.y);ctx.strokeStyle=g;ctx.lineWidth=s.w*s.life;ctx.lineCap="round";ctx.stroke();
            var ha=s.life*.6, hc=s.gold?"212,184,120":"220,230,255";
            ctx.beginPath();ctx.arc(s.x,s.y,s.w*s.life*3,0,Math.PI*2);ctx.fillStyle="rgba("+hc+","+ha+")";ctx.fill();
            ctx.beginPath();ctx.arc(s.x,s.y,s.w*s.life*6,0,Math.PI*2);ctx.fillStyle="rgba("+hc+","+(ha*.12)+")";ctx.fill();
          }
          raf=requestAnimationFrame(draw);
        }

        resize();
        for(var i=0;i<80;i++) pts.push(mkPt());
        draw();
        addEventListener("resize",resize);
        window.__splashCleanup=function(){cancelAnimationFrame(raf);removeEventListener("resize",resize);};
      })();
    </script>

    <div id="root" style="opacity:0;position:fixed;inset:0"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
