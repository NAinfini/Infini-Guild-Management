name: Setup help
description: Get help installing or deploying Infini Guild Management.
title: "[Setup]: "
labels: ["setup"]
body:
  - type: markdown
    attributes:
      value: |
        Read SETUP.md first; it is the canonical setup guide. Remove passwords, cookies, invite codes, .env/.dev.vars files, private migrations, Cloudflare API tokens, and private guild data.
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Cloudflare (D1/R2)
        - VPS (SQLite/filesystem)
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Where are you stuck?
      options:
        - Local installation
        - Cloudflare bindings or login
        - VPS environment or reverse proxy
        - Database migrations
        - First administrator
        - Legacy credential import
        - Backup or restore
        - Deployment
        - Admin Site Config
        - Updating an existing site
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, and pnpm version.
      placeholder: Windows 11, Node 24.18.x, pnpm 11.17.x
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and redacted error
      description: Paste the command and complete error, with all sensitive values removed.
      render: shell
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed all credentials, secrets, tokens, cookies, invite codes, private migrations, and private guild data.
          required: true
