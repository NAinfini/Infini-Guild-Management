name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm 版本不在这里写死：package.json 的 packageManager 字段已经钉了 11.17.0，
      # 这个 action 会自己去读。写两遍就会漂，漂了它直接报错。
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node scripts/check-no-secrets.mjs --ci

      - run: pnpm audit --prod --audit-level=moderate

      # wrangler.jsonc 不入库（每个部署的私有清单）；setup:local 会从
      # wrangler.example.jsonc 复制一份。后面的 config:check 和 dry-run 校验的
      # 就是模板本身，--allow-placeholders 豁免尚未填写的 YOUR_* 资源 ID，
      # 其余结构规则照常执行。
      - run: pnpm setup:local

      - run: pnpm config:check -- --env=production --allow-placeholders

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

      # 对已提交的 production 配置做 dry-run，不联网部署；这能抓到环境专属的
      # D1/R2/DO、assets 和 observability 配置错误。
      - run: pnpm build:worker
        env:
          WRANGLER_SEND_METRICS: 'false'

  # 独立 job：e2e 十几分钟起步，串在 quality 后面会让「lint 挂了」这种一分钟就能
  # 知道的结论也要等十几分钟。两个 job 并行，各报各的。
  e2e:
    name: End-to-End
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 只装 chromium：三个 project 用的都是 Desktop Chrome，把 firefox / webkit
      # 一起拖下来是白花两分钟。
      - run: pnpm exec playwright install --with-deps chromium

      # wrangler.jsonc 不入库；setup:local 从模板复制它，并生成被忽略的本地
      # .dev.vars/SIGNING_SECRET，供 E2E 的 development Worker 使用。
      - run: pnpm setup:local

      # test:e2e = pnpm build && playwright test。产物必须由这一步构建：
      # globalSetup 会比对 dist 与源码的时间戳，旧产物直接报错而不是静默测上一版。
      # D1 迁移和播种不用在这里做——webServer 每个槽位起服务前跑一次幂等迁移，
      # globalSetup 再通过接口重新播种。
      - run: pnpm test:e2e
        env:
          # 运行器是 4 vCPU，每个槽位要养一个 workerd 加一个 chromium。
          # 两槽仍然过订：连续三轮各红一条不同的用例，且都是资源症状而非功能
          # 缺陷——一次本地 D1 读耗了 36 秒最后仍返回 200（trace 见
          # guild-war-history 那条），另两次是成片的 "A network error occurred"。
          # 单槽把进程数减半，整份 e2e 约 25 分钟，仍在本 job 的 45 分钟以内。
          E2E_SLOTS: '1'
          WRANGLER_SEND_METRICS: 'false'
          # 临时取证开关：每条用例打一行「浏览器/回读通道各烧掉多少限流配额」。
          # 就是靠这行数据发现 CI 上的读配额是所有用例共用一个桶的
          # （详见 apps/portal/e2e/support/config.ts 的 clientIdentityHeaders）。
          # 分桶本身已经由 globalSetup 的前置断言守住了，这把尺子留着是为了看
          # 修完之后各条用例的真实用量。连续两轮全绿、且没有任何一条逼近 120
          # 之后删掉这一行。
          E2E_QUOTA_TRACE: '1'

      # 失败时把 trace 和截图带出来。retries 是 0，现场只有这一次。
      #
      # html reporter 只在 CI 上接（playwright.config.ts），它会把 trace、截图和
      # 错误上下文一起拷进 playwright-report/。之前只传 .artifacts/ 那个隐藏目录，
      # 一个文件都没传上来，于是唯一一次现场就没了。
      #
      # if-no-files-found 必须是 error：这一步只在失败时跑，失败却拿不出现场，
      # 本身就是要当场知道的问题，不能让它静默成功。
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-evidence
          path: playwright-report/
          retention-days: 7
          if-no-files-found: error
