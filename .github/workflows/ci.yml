name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm 版本不在这里写死：package.json 的 packageManager 字段已经钉了 11.17.0，
      # 这个 action 会自己去读。写两遍就会漂，漂了它直接报错。
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node scripts/check-no-secrets.mjs --ci

      - run: node --test scripts/check-no-secrets.test.mjs

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

      # wrangler.jsonc 是 gitignore 掉的（带部署身份），CI 里必须先从 example 生成一份，
      # 否则 build:worker 找不到配置。setup:local 是幂等的，本地已有文件时不会覆盖。
      - run: pnpm setup:local

      # dry-run 不联网部署，只做打包 + 绑定校验：能抓到 compatibility_date、
      # Durable Object 迁移、assets 目录这类只有真正打包才会暴露的问题。
      - run: pnpm build:worker
        env:
          WRANGLER_SEND_METRICS: 'false'

  # 独立 job：e2e 十几分钟起步，串在 quality 后面会让「lint 挂了」这种一分钟就能
  # 知道的结论也要等十几分钟。两个 job 并行，各报各的。
  e2e:
    name: End-to-End
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 只装 chromium：三个 project 用的都是 Desktop Chrome，把 firefox / webkit
      # 一起拖下来是白花两分钟。
      - run: pnpm exec playwright install --with-deps chromium

      # 同 quality：wrangler.jsonc 不在仓库里，e2e 的 webServer 要拿它起 worker。
      # 顺带生成 .dev.vars 里的 SIGNING_SECRET，没有它登不上，会话建不起来。
      - run: pnpm setup:local

      # test:e2e = pnpm build && playwright test。产物必须由这一步构建：
      # globalSetup 会比对 dist 与源码的时间戳，旧产物直接报错而不是静默测上一版。
      # D1 迁移和播种不用在这里做——webServer 每个槽位起服务前跑一次幂等迁移，
      # globalSetup 再通过接口重新播种。
      - run: pnpm test:e2e
        env:
          # 运行器是 4 vCPU，每个槽位要养一个 workerd 加一个 chromium。
          # 开满 4 槽会互相抢核，把超时压成随机红灯——那种红比慢更贵。
          E2E_SLOTS: '2'
          WRANGLER_SEND_METRICS: 'false'
          # 临时取证开关：每条用例打一行「浏览器/回读通道各烧掉多少限流配额」。
          # CI 上出现过读配额被打爆的 429（trace 里量到只剩 1–6 次余量），
          # 本地同一批用例的峰值却只有 50–55/120。这个差值本地复现不出来，
          # 只能在 CI 上量，所以先把尺子架在这儿。
          # 连续两轮全绿、且没有任何一条逼近 120 之后删掉这一行。
          E2E_QUOTA_TRACE: '1'

      # 失败时把 trace 和截图带出来。retries 是 0，现场只有这一次。
      #
      # html reporter 只在 CI 上接（playwright.config.ts），它会把 trace、截图和
      # 错误上下文一起拷进 playwright-report/。之前只传 .artifacts/ 那个隐藏目录，
      # 一个文件都没传上来，于是唯一一次现场就没了。
      #
      # if-no-files-found 必须是 error：这一步只在失败时跑，失败却拿不出现场，
      # 本身就是要当场知道的问题，不能让它静默成功。
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-evidence
          path: playwright-report/
          retention-days: 7
          if-no-files-found: error
